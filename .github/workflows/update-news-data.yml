name: Update RSS News Data

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Generate static RSS data
        run: python backend/scripts/generate_news_data.py --sources backend/sources.json --output frontend/public

      - name: Commit and push updated JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/public/data/feed.json frontend/public/data/articles backend/sources.json
          if git diff --cached --quiet; then
            echo "No data changes detected"
            exit 0
          fi
          git commit -m "chore(data): refresh RSS feed output"
          git push
